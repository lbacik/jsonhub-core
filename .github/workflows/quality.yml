name: Quality

# Advisory. Nothing in here can block a push or a PR - every job is
# continue-on-error - and each tool reports as its own job, so several
# independent numbers can be watched moving instead of one green box hiding
# red steps. Two kinds of check live here, with different destinies:
#
# 1. Waiting room - red is a defect in THIS repository, parked here until it
#    reaches zero. Once it is green and can be held there it graduates to
#    test.yml and is deleted from here, not duplicated: an advisory copy of a
#    gating check reports nothing the gate has not already blocked on.
#      - (empty - php-8.4 graduated into test.yml)
#
# 2. Permanent watcher - red when SOMEONE ELSE acts: an advisory published
#    against a dependency we did not change, a dependency releasing a new
#    major. Its red is news, not a defect, so it can never be "held at zero"
#    and must never graduate - gating on it would hand a third party a veto
#    over our commits, biting hardest exactly when we are shipping a fix.
#      - audit, outdated
#
# Deliberately a separate file from test.yml rather than conditional jobs
# inside it: test.yml is reusable via workflow_call, and inside a called
# workflow `github.event_name` is still the caller's ("push" for a tag push),
# so an `if:` cannot tell "called by a release" from "someone pushed a branch".
on:
  push:
    branches: ['**']
  pull_request:
  # Watchers only. Off the hour on purpose: GitHub queues scheduled runs and
  # drops them under load, and :00 is the most popular minute. The schedule
  # only ever runs from the DEFAULT BRANCH's copy of this file (main), so it is
  # inert until this file is merged there.
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The only supported runtime - api runs 8.4 in production.
  PHP_VERSION: '8.4'

jobs:
  # Watchers: neutral on a push/PR so unrelated work is not reddened, but
  # allowed to fail on the schedule - a scheduled run that swallows its own
  # failure notifies nobody.
  #
  # composer.lock is not committed, so both resolve fresh from composer.json -
  # exactly what a consumer gets.
  audit:
    name: Composer audit (watcher)
    continue-on-error: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v4
      # Security advisories only. Abandoned packages are reported but do not
      # fail this job: the outdated watcher below already lists them, and a
      # known abandonment would otherwise mask every new advisory behind a
      # permanently red box.
      - run: composer audit --abandoned=report

  outdated:
    name: Outdated majors (watcher)
    continue-on-error: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v4
      # Majors only: with no lockfile, minors and patches are picked up by
      # every install anyway; a new major is the one thing composer.json has
      # to be edited for.
      - run: composer outdated --direct --major-only --strict
