name: Test

# The gate. This file is allowed to be red only when the repository is broken.
#
# jsonhub/core is a library: there is no image, no environment and no deploy.
# Consumers pull a tag through Composer, so what this file protects is every
# commit that could become a tag. `workflow_call` is exposed so that a future
# release workflow (e.g. publishing a GitHub Release from a `v*` tag) can reuse
# the gate instead of growing a second copy of it that drifts.
#
# `branches: ['**']` matches every branch and no tag: the commit a tag points at
# has already been through this on its branch push.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # No `services:` - the specs are pure unit specs with the repositories mocked
  # through the Contracts interfaces; nothing touches a database or a cache.
  #
  # The matrix is the consumers' runtimes, not this repository's (it has none):
  # front-v1 declares php >=8.2, api runs 8.4 in production.
  #
  # composer.lock is not committed, so every run resolves the newest versions
  # allowed by composer.json - the same thing a consumer's `composer update`
  # gets. There is no prefer-lowest leg: the only runtime dependency is
  # lbacik/value-object ^1.0, and a lowest leg would mostly test old dev tools.
  checks:
    name: Checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Coverage is collected (and uploaded) on one leg only.
        # phpspec-code-coverage aborts the whole run when no coverage driver is
        # loaded, so the leg without one passes --no-coverage explicitly.
        include:
          - php: '8.2'
            coverage: none
            phpspec-args: --no-coverage
          - php: '8.3'
            coverage: pcov
            phpspec-args: ''
          - php: '8.4'
            coverage: none
            phpspec-args: --no-coverage

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      # There is no type checker in require-dev (no phpstan/psalm), so lint is
      # the first check after install.
      - name: Check code style (PHP_CodeSniffer, PSR12)
        run: vendor/bin/phpcs

      - name: Run specs
        run: vendor/bin/phpspec run --no-interaction --format=progress ${{ matrix.phpspec-args }}

      # Reporting, not gating: fail_ci_if_error stays false so a Codecov outage
      # (or a fork PR, which receives no CODECOV_TOKEN) cannot redden the gate.
      - name: Upload coverage to Codecov
        if: matrix.coverage == 'pcov'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: lbacik/jsonhub-core
          files: ./coverage/coverage_phpspec.xml
          fail_ci_if_error: false
